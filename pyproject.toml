[project]
name = "omnimedia"
version = "2.0.0"
description = "Desktop YouTube downloader and media converter (yt-dlp + ffmpeg + pywebview)"
requires-python = ">=3.11"
dependencies = [
    # [default] pulls in yt-dlp-ejs, the YouTube JS challenge solver.
    # Without it many videos fail with "Signature solving failed".
    "yt-dlp[default]>=2026.10.26",
    "pywebview>=6.2",
]

[project.scripts]
omnimedia = "omnimedia.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["omnimedia", "omnimedia.web"]

[tool.setuptools.package-data]
"omnimedia.web" = ["*"]
